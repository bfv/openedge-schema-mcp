[project]
name = "openedge-schema-mcp"
dynamic = ["version"]
description = "MCP server for OpenEdge .df schema files and relationship catalogs"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
openedge-schema-mcp = "openedge_schema_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.pytest.ini_options]
testpaths = ["tests"]
