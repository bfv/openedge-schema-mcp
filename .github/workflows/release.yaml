name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    outputs:
      is_semver: ${{ steps.semver.outputs.is_semver }}
    steps:
      - id: semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ "$TAG" =~ $pattern ]]; then
            echo "is_semver=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_semver=false" >> "$GITHUB_OUTPUT"
            echo "Tag '$TAG' is not a semantic version; no release will be created."
          fi

  test:
    needs: validate_tag
    if: needs.validate_tag.outputs.is_semver == 'true'
    uses: ./.github/workflows/test.yaml

  release:
    needs: [validate_tag, test]
    if: needs.validate_tag.outputs.is_semver == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          arguments=(release create "$TAG" --generate-notes --target "$TARGET")
          if [[ "$TAG" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"